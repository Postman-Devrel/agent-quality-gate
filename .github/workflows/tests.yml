# The project's own tests (JUnit). The quality gate judges the contract and the collection, not the code.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test
