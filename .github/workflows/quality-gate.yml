# Agent quality gate: changes -> build -> 5 gate steps (parallel) -> aggregate, comment, decide.
# The gate runs only when something it judges changed (contract, code, Postman files, gate, build);
# otherwise the quality-gate job succeeds at once and says why, so it can still be a required check.
# The gate runs in CI, outside the coding agent: the agent cannot skip it.
# Make the "quality-gate" job a required check to block merges.
name: quality-gate

on:
  push: # every branch, main included: an agent's push is judged without waiting for a PR, and merges are re-checked
  pull_request:
  workflow_dispatch:

# One run per branch: a new push (or the PR event for the same branch) replaces the previous run.
concurrency:
  group: quality-gate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Verified in docs/cli-inventory.md. Bump deliberately, then re-run the inventory.
  POSTMAN_CLI_VERSION: 1.73.0

jobs:
  # Decides whether the change touches anything the gate judges.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # What the gate judges. Docs, README, the Claude Code mod and the agents' own files do not count.
          RELEVANT='^(src/|postman/|\.postman/|gate/|\.mvn/|mvnw|pom\.xml$|quality-gate\.yml$|\.github/workflows/quality-gate\.yml$)'
          relevant=true
          if [ "$EVENT" != "workflow_dispatch" ]; then
            # A branch is judged on what it changes against the default branch, as a PR is: the push run and
            # the pull_request run of the same branch must reach the same decision (they share a concurrency
            # group, the later one replaces the earlier). Only a push to the default branch is compared with
            # what was there before it.
            if [ "$EVENT" = "pull_request" ]; then base="origin/$BASE_REF"
            elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"
            else base="origin/$DEFAULT_BRANCH"; fi
            if files="$(git diff --name-only "$base"...HEAD 2>/dev/null)"; then
              echo "Changed files against $base:"; echo "$files"
              if ! echo "$files" | grep -Eq "$RELEVANT"; then relevant=false; fi
            else
              echo "Could not diff against $base: running the gate to be safe."
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Gate needed: $relevant"

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compile only: tests belong to the gate (step 3), not to the build.
      - run: ./mvnw -B -DskipTests package

  gate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: skills-check,  script: gate/01-skills-check.sh }
          - { step: contract-lint, script: gate/02-contract-lint.sh }
          - { step: tests,         script: gate/03-tests.sh }
          - { step: ai-readiness,  script: gate/04-ai-readiness.sh }
          - { step: impact,        script: gate/05-impact.sh }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the impact step diffs the contract against the base branch
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the Postman CLI
        run: npm install -g "postman-cli@${POSTMAN_CLI_VERSION}"
      - name: Log in to Postman
        # The key reaches the CLI through the environment only; it is masked in logs.
        # Without the secret (fork PR) the steps that need the cloud report not_available.
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [ -n "$POSTMAN_API_KEY" ]; then
            postman login --with-api-key "$POSTMAN_API_KEY" > /dev/null
          else
            echo "POSTMAN_API_KEY is not set: cloud-backed steps will be not_available"
          fi
      - name: Run the gate step (it never fails the job, the aggregate job decides)
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          GATE_BASE_REF: origin/${{ github.base_ref || github.event.repository.default_branch }}
          IMPACT_API: ${{ vars.IMPACT_API }}
        run: |
          # An empty repository variable must fall back to the script default.
          [ -z "$IMPACT_API" ] && unset IMPACT_API
          ./${{ matrix.script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-${{ matrix.step }}
          path: gate-results/${{ matrix.step }}.json
          if-no-files-found: warn

  quality-gate:
    needs: [changes, gate]
    # Decide even when a gate job crashed (a missing result counts as not_available), but not when the
    # whole run was cancelled by the concurrency group: that run has no results and must not report a failure.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the report comment
      actions: read
    steps:
      - name: Gate not needed for this change
        if: needs.changes.outputs.relevant != 'true'
        run: |
          { echo "### Quality gate skipped"; echo; echo "No file the gate judges changed (contract, code, Postman files, gate, build). Nothing to score."; } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p gate-results
          echo '{"skipped":true,"reason":"no relevant change"}' > gate-results/report.json
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.changes.outputs.relevant == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.relevant == 'true'
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.changes.outputs.relevant == 'true'
        with:
          pattern: gate-*
          path: gate-results
          merge-multiple: true
      - name: Aggregate (score, rating, report, job summary)
        if: needs.changes.outputs.relevant == 'true'
        run: node gate/aggregate.js --no-exit-code
      - name: Post or update the PR comment
        if: needs.changes.outputs.relevant == 'true' && github.event_name != 'workflow_dispatch'
        continue-on-error: true # fork PRs get a read-only token
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gate-results/report.md', 'utf8');
            const marker = '<!-- agent-quality-gate -->';
            const { owner, repo } = context.repo;
            // pull_request event: the PR is in the context. push event: look up the open PR of the branch.
            let issue_number = context.payload.pull_request?.number;
            if (!issue_number) {
              const prs = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${context.ref_name || process.env.GITHUB_REF_NAME}` });
              issue_number = prs.data[0]?.number;
            }
            if (!issue_number) { core.info('No open PR for this branch: report is in the job summary.'); return; }
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-report
          path: gate-results/report.*
      - name: Fail the check when the gate fails
        if: needs.changes.outputs.relevant == 'true'
        run: |
          passed="$(node -p "require('./gate-results/report.json').passed")"
          [ "$passed" = "true" ] || { echo "Quality gate failed"; exit 1; }
