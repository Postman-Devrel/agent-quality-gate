$kind: http-example
name: Unexpected server error.
request:
  url: "{{baseUrl}}/orders"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "customerId": "cus_42",
        "items": [
          {
            "sku": "SKU-1",
            "quantity": 2,
            "unitPrice": 29.95
          }
        ]
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "INTERNAL_ERROR",
        "message": "Unexpected error"
      }
order: 3000
