$kind: http-example
name: Unexpected server error.
request:
  url: "{{baseUrl}}/orders?status=CANCELLED"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    status: CANCELLED
  body:
    type: text
    content: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "INTERNAL_ERROR",
        "message": "Unexpected error"
      }
order: 2000
