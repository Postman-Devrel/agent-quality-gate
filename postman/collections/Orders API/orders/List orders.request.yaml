$kind: http-request
description: Returns orders, optionally filtered by status.
url: '{{baseUrl}}/orders?status=CANCELLED'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: status
    value: CANCELLED
    disabled: false
    description: Only return orders in this status.
settings: {}
examples: ./.resources/List orders.resources/examples
order: 1000
scripts:
  - type: afterResponse
    code: |
      function checkOrder(o) {
        pm.expect(o).to.have.all.keys("id", "customerId", "status", "totalAmount", "items");
        pm.expect(o.id).to.be.a("string");
        pm.expect(o.totalAmount).to.be.a("number");
        pm.expect(["PENDING","PAID","SHIPPED","CANCELLED"]).to.include(o.status);
        pm.expect(o.items).to.be.an("array");
      }
      pm.test("200 and an array of orders", () => { pm.response.to.have.status(200); const b = pm.response.json(); pm.expect(b).to.be.an("array"); b.forEach(checkOrder); });
    language: text/javascript
