$kind: http-request
description: Moves an order to a new status.
url: '{{baseUrl}}/orders/:orderId/status'
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: orderId
    value: ord_1002
    disabled: false
    description: (Required) Order identifier.
body:
  type: json
  content: |-
    {
      "status": "PAID"
    }
settings: {}
examples: ./.resources/Update the status of an order.resources/examples
order: 3000
scripts:
  - type: afterResponse
    code: |
      function checkOrder(o) {
        pm.expect(o).to.include.all.keys("id", "customerId", "status", "totalAmount", "items");
        pm.expect(o.id).to.be.a("string");
        pm.expect(o.totalAmount).to.be.a("number");
        pm.expect(["PENDING","PAID","SHIPPED","CANCELLED"]).to.include(o.status);
        pm.expect(o.items).to.be.an("array");
      }
      pm.test("200 and the order contract", () => { pm.response.to.have.status(200); checkOrder(pm.response.json()); });
    language: text/javascript
