$kind: http-example
name: The order state does not allow this operation.
request:
  url: "{{baseUrl}}/orders/:orderId"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: orderId
      value: ord_1001
      disabled: false
      description: (Required) Order identifier.
  body:
    type: text
    content: ""
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "CONFLICT",
        "message": "Order already shipped"
      }
order: 3000
