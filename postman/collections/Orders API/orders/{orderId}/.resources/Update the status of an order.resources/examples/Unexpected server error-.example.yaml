$kind: http-example
name: Unexpected server error.
request:
  url: "{{baseUrl}}/orders/:orderId/status"
  method: PUT
  headers:
    Accept: application/json
  pathVariables:
    - key: orderId
      value: ord_1001
      disabled: false
      description: (Required) Order identifier.
  body:
    type: json
    content: |-
      {
        "status": "PAID"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "INTERNAL_ERROR",
        "message": "Unexpected error"
      }
order: 5000
