$kind: http-example
name: The request is invalid.
request:
  url: "{{baseUrl}}/orders/:orderId/status"
  method: PUT
  headers:
    Accept: application/json
  pathVariables:
    - key: orderId
      value: ord_1001
      disabled: false
      description: (Required) Order identifier.
  body:
    type: json
    content: |-
      {
        "status": "PAID"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "BAD_REQUEST",
        "message": "items must not be empty"
      }
order: 2000
