$kind: http-example
name: At least one dependency check failed.
request:
  url: "{{baseUrl}}/ready"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "degraded",
        "service": "appointments-service",
        "problems": [
          "db: connection refused"
        ]
      }
order: 2000
