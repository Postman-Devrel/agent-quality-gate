$kind: http-example
name: All probed dependencies are reachable.
request:
  url: "{{baseUrl}}/ready"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "service": "appointments-service",
        "problems": []
      }
order: 1000
