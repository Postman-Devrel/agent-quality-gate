$kind: http-request
description: |
  Returns a page of appointments plus the total count matching the filter.

  **Ad-hoc filtering.** Any query parameter other than `limit`, `offset` and
  `status` is treated as a JSON field filter and compiled to
  `data->>'<key>' = '<value>'`. Multiple filters are ANDed. This is how you
  query by `patient_id`, `provider_id` or `slot_id`. Because the set of keys
  is open-ended it cannot be enumerated here.

  Publishes: `audit.event` (`appointments.list`).
url: '{{baseUrl}}/api/appointments?limit=25&offset=0&status=active'
method: GET
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published Kafka
      events. Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
queryParams:
  - key: limit
    value: '25'
    disabled: false
    description: |
      Page size. Defaults to 50. Values above 500 are silently clamped to
      500 rather than rejected.
  - key: offset
    value: '0'
    disabled: false
    description: Number of rows to skip, applied after ordering by `id` ascending.
  - key: status
    value: active
    disabled: false
    description: |
      Exact match on the envelope `status` column (not on `data`).
      See `Appointment.status` for the observed vocabulary.
settings: {}
examples: ./.resources/List appointments.resources/examples
order: 1000
scripts:
  - type: afterResponse
    code: |
      function checkAppointment(a) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(a).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(a.id).to.be.a("number");
        pm.expect(a.status).to.be.a("string");
      }
      pm.test("200 and a page of appointments", () => { pm.response.to.have.status(200); const b = pm.response.json(); pm.expect(b).to.include.all.keys("count", "items"); pm.expect(b.items).to.be.an("array"); b.items.forEach(checkAppointment); });
    language: text/javascript
