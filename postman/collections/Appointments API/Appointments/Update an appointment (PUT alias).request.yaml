$kind: http-request
description: |
  Identical to `PATCH /api/appointments/{record_id}` — the same handler is
  bound to both verbs, so this performs a **shallow merge**, not a
  replacement, and emits the same `appointment.cancelled` event. Prefer
  `PATCH`.
url: '{{baseUrl}}/api/appointments/:record_id'
method: PUT
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published Kafka
      events. Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: record_id
    value: '2317'
    disabled: false
    description: (Required) Primary key of the appointment record.
body:
  type: json
  content: |-
    {
      "starts_at": "2026-08-21T09:00:00+00:00",
      "reason": "Rescheduled at patient request"
    }
settings: {}
examples: ./.resources/Update an appointment (PUT alias).resources/examples
order: 5000
scripts:
  - type: afterResponse
    code: |
      function checkAppointment(a) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(a).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(a.id).to.be.a("number");
        pm.expect(a.status).to.be.a("string");
      }
      pm.test("200 and the appointment envelope", () => { pm.response.to.have.status(200); checkAppointment(pm.response.json()); });
    language: text/javascript
