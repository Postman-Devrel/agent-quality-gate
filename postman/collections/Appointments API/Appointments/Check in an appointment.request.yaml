$kind: http-request
description: |
  Sets `status` to `checked_in` and returns the full updated record.

  No guard conditions: the endpoint does not check the current status, so a
  cancelled appointment can be checked in. Unlike `cancel`, this publishes
  **no domain event** — only an audit record.

  Publishes: `audit.event` (`appointment.check_in`).
url: '{{baseUrl}}/api/appointments/:record_id/check-in'
method: POST
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published Kafka
      events. Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
pathVariables:
  - key: record_id
    value: '2317'
    disabled: false
    description: (Required) Primary key of the appointment record.
settings: {}
examples: ./.resources/Check in an appointment.resources/examples
order: 8000
scripts:
  - type: afterResponse
    code: |
      function checkAppointment(a) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(a).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(a.id).to.be.a("number");
        pm.expect(a.status).to.be.a("string");
      }
      pm.test("200 and the appointment envelope", () => { pm.response.to.have.status(200); checkAppointment(pm.response.json()); });
    language: text/javascript
