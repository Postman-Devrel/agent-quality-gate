$kind: http-example
name: No appointment exists with the given id.
request:
  url: "{{baseUrl}}/api/appointments/:record_id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Request-ID
      value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
      disabled: false
      description: |
        Correlation id propagated across HTTP hops and onto published Kafka
        events. Generated by the service if omitted, and echoed on every response.
    - key: Accept
      value: application/json
  pathVariables:
    - key: record_id
      value: "2317"
      disabled: false
      description: (Required) Primary key of the appointment record.
  body:
    type: json
    content: |-
      {
        "starts_at": "2026-08-21T09:00:00+00:00",
        "reason": "Rescheduled at patient request"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "appointments 999999 not found"
      }
order: 4000
