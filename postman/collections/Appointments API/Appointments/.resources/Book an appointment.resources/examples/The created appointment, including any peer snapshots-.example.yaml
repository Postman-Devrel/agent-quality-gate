$kind: http-example
name: The created appointment, including any peer snapshots.
request:
  url: "{{baseUrl}}/api/appointments"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Request-ID
      value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
      disabled: false
      description: |
        Correlation id propagated across HTTP hops and onto published Kafka
        events. Generated by the service if omitted, and echoed on every response.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "patient_id": 77,
        "provider_id": 12,
        "slot_id": 5501,
        "starts_at": "2026-08-20T14:30:00+00:00",
        "duration_minutes": 30,
        "reason": "Annual physical"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: X-Request-ID
      value: string
      disabled: false
      description: The correlation id for this request, echoed back.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": 2317,
        "status": "active",
        "created_at": "2026-08-12T09:14:22.481930+00:00",
        "updated_at": "2026-08-12T09:14:22.481930+00:00",
        "patient_id": 77,
        "provider_id": 12,
        "slot_id": 5501,
        "starts_at": "2026-08-20T14:30:00+00:00",
        "duration_minutes": 30,
        "reason": "Annual physical"
      }
order: 1000
