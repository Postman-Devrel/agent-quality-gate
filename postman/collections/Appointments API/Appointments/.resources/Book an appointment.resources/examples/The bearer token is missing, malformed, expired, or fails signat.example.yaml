$kind: http-example
name: The bearer token is missing, malformed, expired, or fails signature verification.
request:
  url: "{{baseUrl}}/api/appointments"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Request-ID
      value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
      disabled: false
      description: |
        Correlation id propagated across HTTP hops and onto published Kafka
        events. Generated by the service if omitted, and echoed on every response.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "patient_id": 77,
        "provider_id": 12,
        "slot_id": 5501,
        "starts_at": "2026-08-20T14:30:00+00:00",
        "duration_minutes": 30,
        "reason": "Annual physical"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "missing bearer token"
      }
order: 2000
