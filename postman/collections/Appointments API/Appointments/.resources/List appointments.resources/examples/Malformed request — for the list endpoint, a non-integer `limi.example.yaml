$kind: http-example
name: Malformed request — for the list endpoint, a non-integer `limit` or `offset`.
request:
  url: "{{baseUrl}}/api/appointments?limit=25&offset=0&status=active"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Request-ID
      value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
      disabled: false
      description: |
        Correlation id propagated across HTTP hops and onto published Kafka
        events. Generated by the service if omitted, and echoed on every response.
    - key: Accept
      value: application/json
  queryParams:
    limit: "25"
    offset: "0"
    status: active
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "offset/limit must be integers"
      }
order: 2000
