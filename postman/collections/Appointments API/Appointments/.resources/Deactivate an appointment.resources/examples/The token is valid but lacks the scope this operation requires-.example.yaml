$kind: http-example
name: The token is valid but lacks the scope this operation requires.
request:
  url: "{{baseUrl}}/api/appointments/:record_id"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Request-ID
      value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
      disabled: false
      description: |
        Correlation id propagated across HTTP hops and onto published Kafka
        events. Generated by the service if omitted, and echoed on every response.
    - key: Accept
      value: application/json
  pathVariables:
    - key: record_id
      value: "2317"
      disabled: false
      description: (Required) Primary key of the appointment record.
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "insufficient scope",
        "required": [
          "appointments.write"
        ],
        "have": [
          "appointments.read"
        ]
      }
order: 3000
