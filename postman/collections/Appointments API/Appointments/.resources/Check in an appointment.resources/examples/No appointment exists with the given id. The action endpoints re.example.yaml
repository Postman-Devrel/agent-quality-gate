$kind: http-example
name: |
  No appointment exists with the given id. The action endpoints return the
  terse body `{"error": "not found"}` rather than the resource-qualified
  message used by the CRUD endpoints.
request:
  url: "{{baseUrl}}/api/appointments/:record_id/check-in"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Request-ID
      value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
      disabled: false
      description: |
        Correlation id propagated across HTTP hops and onto published Kafka
        events. Generated by the service if omitted, and echoed on every response.
    - key: Accept
      value: application/json
  pathVariables:
    - key: record_id
      value: "2317"
      disabled: false
      description: (Required) Primary key of the appointment record.
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "not found"
      }
order: 4000
