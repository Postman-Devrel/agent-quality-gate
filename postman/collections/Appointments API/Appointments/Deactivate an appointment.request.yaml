$kind: http-request
description: |
  Soft delete. Sets `status` to `inactive` and bumps `updated_at`; the row and
  its `data` document are retained and remain readable via
  `GET /api/appointments/{record_id}`.

  This is distinct from `POST /api/appointments/{record_id}/cancel`, which
  sets `status` to `cancelled` and returns the full record. Use `cancel` for
  the business action and `DELETE` for record retirement.

  Safe to repeat — a second call on an already inactive record still
  returns `200`.

  Publishes: `appointment.cancelled`, `audit.event`
  (`appointments.deactivate`).
url: '{{baseUrl}}/api/appointments/:record_id'
method: DELETE
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published Kafka
      events. Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
pathVariables:
  - key: record_id
    value: '2317'
    disabled: false
    description: (Required) Primary key of the appointment record.
settings: {}
examples: ./.resources/Deactivate an appointment.resources/examples
order: 6000
scripts:
  - type: afterResponse
    code: |
      function checkAppointment(a) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(a).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(a.id).to.be.a("number");
        pm.expect(a.status).to.be.a("string");
      }
      pm.test("200 on deactivate", () => { pm.response.to.have.status(200); pm.expect(pm.response.json()).to.be.an("object"); });
    language: text/javascript
