$kind: http-request
description: |
  Creates an appointment. The request body is stored verbatim as the record's
  `data` document, except for `id`, which is stripped if present.

  Before insert, the service enriches the payload with snapshots from
  `patients-service` and `providers-service` (see the peer-enrichment table
  in the API description). Those snapshots are persisted into `data`, so they
  appear on every subsequent read of the record.

  No availability check is performed: the service does not verify that
  `slot_id` exists, is open, or does not collide with another booking.

  Publishes: `appointment.booked`, `audit.event` (`appointments.create`).
url: '{{baseUrl}}/api/appointments'
method: POST
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published Kafka
      events. Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 77,
      "provider_id": 12,
      "slot_id": 5501,
      "starts_at": "2026-08-20T14:30:00+00:00",
      "duration_minutes": 30,
      "reason": "Annual physical"
    }
settings: {}
examples: ./.resources/Book an appointment.resources/examples
order: 2000
scripts:
  - type: afterResponse
    code: |
      function checkAppointment(a) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(a).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(a.id).to.be.a("number");
        pm.expect(a.status).to.be.a("string");
      }
      pm.test("201 and the appointment envelope", () => { pm.response.to.have.status(201); checkAppointment(pm.response.json()); });
    language: text/javascript
