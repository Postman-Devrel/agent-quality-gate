$kind: http-request
description: |
  Moves the appointment to a new start time and returns the full updated
  record. `starts_at` is required; `slot_id`, `provider_id` and `reason` are
  optional and, when present, replace the stored values. Status is left
  unchanged.

  A missing or non-ISO-8601 `starts_at` returns 400 (fix the input, do not
  retry as is).

  Publishes: `appointment.rescheduled`, `audit.event`
  (`appointment.reschedule`).
url: '{{baseUrl}}/api/appointments/:record_id/reschedule'
method: POST
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published Kafka
      events. Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: record_id
    value: '2317'
    disabled: false
    description: (Required) Primary key of the appointment record.
body:
  type: json
  content: |-
    {
      "starts_at": "2026-08-21T09:00:00+00:00",
      "slot_id": 5620,
      "reason": "Patient request"
    }
settings: {}
examples: ./.resources/Reschedule an appointment.resources/examples
order: 9000
scripts:
  - type: afterResponse
    code: |
      function checkAppointment(a) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(a).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(a.id).to.be.a("number");
        pm.expect(a.status).to.be.a("string");
      }
      pm.test("200 and the appointment envelope", () => { pm.response.to.have.status(200); checkAppointment(pm.response.json()); });
      pm.test("starts_at is the requested time", () => pm.expect(pm.response.json().starts_at).to.eql("2026-08-21T09:00:00+00:00"));
    language: text/javascript
